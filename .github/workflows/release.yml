name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Test before publishing
        run: npm test

      - name: Check whether this version is already published
        id: published
        run: |
          version="${GITHUB_REF_NAME#v}"
          if npm view "dsh-experiment-ledger@${version}" version >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check npm token
        id: token
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "$NODE_AUTH_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish preview to npm
        if: steps.published.outputs.exists == 'false' && steps.token.outputs.present == 'true'
        run: npm publish --provenance --access public --tag preview
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Note skipped npm publish
        if: steps.token.outputs.present != 'true'
        run: echo "NPM_TOKEN is not configured; skipped npm publish. The tarball is attached to the GitHub Release."
